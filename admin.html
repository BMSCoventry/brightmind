<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrightMind - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">BrightMind Admin Portal</a>
      <div id="admin-nav-links" class="d-none">
        <a href="add-student.html" class="btn btn-primary btn-sm fw-bold">+ Add New Student</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 850px;">

    <!-- Admin Authentication Card -->
    <div id="admin-login-card" class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4" style="max-width: 400px; margin: 0 auto; width: 100%;">
        <h4 class="card-title fw-bold text-center mb-3">Admin Login</h4>
        <form id="adminLoginForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Admin Password</label>
            <input type="password" id="admin-pass" class="form-control" required>
          </div>
          <button type="submit" id="adminLoginBtn" class="btn btn-dark w-100 fw-bold">Unlock Admin Dashboard</button>
        </form>
        <div id="adminLoginAlert" class="alert alert-danger mt-3 d-none"></div>
      </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="d-none">
      
      <div class="row g-4">
        
        <!-- Log Completed Lesson -->
        <div class="col-md-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body p-4">
              <h5 class="fw-bold mb-3">1. Log Completed Lesson</h5>
              <div class="mb-3">
                <label class="form-label fw-semibold">Select Student</label>
                <select id="lesson-student-select" class="form-select" onchange="autoFillFee(this, 'lesson-fee')"></select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Session Fee (£)</label>
                <input type="number" id="lesson-fee" step="0.01" class="form-control">
              </div>
              <button onclick="logLesson()" class="btn btn-primary w-100 fw-bold">Debit Fee & Log Attendance</button>
            </div>
          </div>
        </div>

        <!-- Record Payment -->
        <div class="col-md-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body p-4">
              <h5 class="fw-bold mb-3">2. Record Payment</h5>
              <div class="mb-3">
                <label class="form-label fw-semibold">Select Student</label>
                <select id="pay-student-select" class="form-select"></select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Amount Received (£)</label>
                <input type="number" id="pay-amount" step="0.01" class="form-control">
              </div>
              <button onclick="logPayment()" class="btn btn-success w-100 fw-bold">Credit Payment</button>
            </div>
          </div>
        </div>

      </div>

      <!-- Assign Homework -->
      <div class="card shadow-sm border-0 mt-4">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-3">3. Assign Homework & Trigger WhatsApp</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Select Student</label>
              <select id="hw-student-select" class="form-select" onchange="autoFillPhone(this)"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Mobile Number</label>
              <input type="tel" id="hw-phone" class="form-control" placeholder="+44...">
            </div>
            <div class="col-md-12">
              <label class="form-label fw-semibold">Assignment Title</label>
              <input type="text" id="hw-title" class="form-control" placeholder="e.g. GCSE Algebra Sheet 1">
            </div>
            <div class="col-md-8">
              <label class="form-label fw-semibold">Details / Instructions</label>
              <input type="text" id="hw-details" class="form-control" placeholder="Complete Questions 1-10">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Due Date</label>
              <input type="date" id="hw-due" class="form-control">
            </div>
          </div>
          <button onclick="assignHW()" class="btn btn-dark w-100 fw-bold mt-3">Assign & Send WhatsApp Alert</button>
        </div>
      </div>

      <!-- Reset Student PIN -->
      <div class="card shadow-sm border-0 mt-4 mb-5">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-3">4. Reset Student PIN</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Select Student</label>
              <select id="reset-student-select" class="form-select"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">New 4-Digit PIN</label>
              <input type="password" id="reset-pin" class="form-control" maxlength="4" placeholder="e.g. 5678">
            </div>
          </div>
          <button onclick="resetPin()" class="btn btn-warning w-100 fw-bold mt-3">Reset Student PIN</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKqaum5Rpok2gru6seuIoIqphLCMEuUJFWGsy1KKmbxUXgH2WfynSMRhRR_xbIAHz9/exec";
    let globalStudentList = [];

    document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = document.getElementById('admin-pass').value;
      const alertEl = document.getElementById('adminLoginAlert');
      alertEl.classList.add('d-none');

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'adminLogin', payload: { password } })
      });
      const data = await res.json();

      if (data.status === 'success') {
        document.getElementById('admin-login-card').classList.add('d-none');
        document.getElementById('admin-dashboard').classList.remove('d-none');
        document.getElementById('admin-nav-links').classList.remove('d-none');
        loadStudents();
      } else {
        alertEl.innerText = data.message;
        alertEl.classList.remove('d-none');
      }
    });

    async function loadStudents() {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getStudentList' })
      });
      const data = await res.json();

      if (data.status === 'success') {
        globalStudentList = data.students;
        populateDropdowns();
      }
    }

    function populateDropdowns() {
      const options = globalStudentList.map(s => `<option value="${s.studentId}" data-fee="${s.customFee}" data-phone="${s.phone}">${s.name} (${s.yearGroup}) - ${s.studentId}</option>`).join('');
      const defaultOpt = `<option value="" disabled selected>Select a Student...</option>`;

      document.getElementById('lesson-student-select').innerHTML = defaultOpt + options;
      document.getElementById('pay-student-select').innerHTML = defaultOpt + options;
      document.getElementById('hw-student-select').innerHTML = defaultOpt + options;
      document.getElementById('reset-student-select').innerHTML = defaultOpt + options;
    }

    function autoFillFee(selectEl, targetId) {
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      document.getElementById(targetId).value = selectedOption.getAttribute('data-fee') || '';
    }

    function autoFillPhone(selectEl) {
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      document.getElementById('hw-phone').value = selectedOption.getAttribute('data-phone') || '';
    }

    async function logLesson() {
      const studentId = document.getElementById('lesson-student-select').value;
      const fee = document.getElementById('lesson-fee').value;
      if (!studentId || !fee) return alert("Select a student and enter fee.");

      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'recordLesson', payload: { studentId, fee } }) });
      const data = await res.json();
      alert(data.status === 'success' ? 'Lesson logged and fee debited.' : 'Error logging lesson');
    }

    async function logPayment() {
      const studentId = document.getElementById('pay-student-select').value;
      const amount = document.getElementById('pay-amount').value;
      if (!studentId || !amount) return alert("Select a student and enter amount.");

      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'recordPayment', payload: { studentId, amount } }) });
      const data = await res.json();
      alert(data.status === 'success' ? 'Payment credited.' : 'Error logging payment');
    }

    async function assignHW() {
      const payload = {
        studentId: document.getElementById('hw-student-select').value,
        phone: document.getElementById('hw-phone').value,
        title: document.getElementById('hw-title').value,
        details: document.getElementById('hw-details').value,
        dueDate: document.getElementById('hw-due').value
      };
      if (!payload.studentId || !payload.title) return alert("Select a student and enter assignment title.");

      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'assignHomework', payload }) });
      const data = await res.json();
      alert(data.status === 'success' ? 'Homework assigned and WhatsApp alert sent!' : 'Error assigning homework');
    }

    async function resetPin() {
      const studentId = document.getElementById('reset-student-select').value;
      const newPin = document.getElementById('reset-pin').value;
      if (!studentId || !newPin) return alert("Select a student and enter a 4-digit PIN.");

      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'resetStudentPin', payload: { studentId, newPin } }) });
      const data = await res.json();
      alert(data.status === 'success' ? 'Student PIN reset successfully!' : 'Error resetting PIN');
    }
  </script>
</body>
</html>
