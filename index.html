<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrightMind - Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">BrightMind Student Portal</a>
    </div>
  </nav>

  <div class="container py-3" style="max-width: 550px;">
    
    <!-- Login Card -->
    <div id="login-card" class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title fw-bold text-center mb-4">Student Login</h4>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Student ID</label>
            <input type="text" id="login-id" class="form-control form-control-lg" placeholder="e.g. STU-1001" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">4-Digit PIN</label>
            <input type="password" id="login-pin" class="form-control form-control-lg" maxlength="4" placeholder="••••" required>
          </div>
          <button type="submit" id="loginBtn" class="btn btn-primary btn-lg w-100 fw-bold">Login to Dashboard</button>
        </form>
        <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
      </div>
    </div>

    <!-- Student Dashboard -->
    <div id="dashboard" class="d-none">
      
      <!-- Balance Card -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4 text-center">
          <h5 class="text-muted mb-2">Welcome back, <span id="student-name-display" class="fw-bold text-dark"></span>!</h5>
          <hr class="my-3">
          <p class="text-muted mb-1 small uppercase fw-semibold">Current Balance</p>
          <h2 id="balance-display" class="display-6 fw-bold">£0.00</h2>
          <small class="text-muted d-block mt-2">(Positive = Credit Balance | Negative = Payment Due)</small>
        </div>
      </div>

      <!-- Homework List -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white fw-bold py-3">Assigned Homework</div>
        <ul id="homework-list" class="list-group list-group-flush"></ul>
      </div>

      <!-- Ledger / History List -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white fw-bold py-3">Payment & Session History</div>
        <ul id="ledger-list" class="list-group list-group-flush"></ul>
      </div>

      <button onclick="logout()" class="btn btn-outline-secondary w-100 mb-5">Logout</button>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLExo5Fpf3oewa3PSzw1jvFcii0vDjkjlkntJiXfPzVRBSog8X9bjwQpDWbNRxNKlw/exec";

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('loginBtn');
      const alertEl = document.getElementById('loginAlert');
      
      loginBtn.disabled = true;
      alertEl.classList.add('d-none');

      const studentId = document.getElementById('login-id').value;
      const pin = document.getElementById('login-pin').value;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'studentLogin', payload: { studentId, pin } })
        });
        const data = await res.json();

        if (data.status === 'success') {
          document.getElementById('login-card').classList.add('d-none');
          document.getElementById('dashboard').classList.remove('d-none');
          document.getElementById('student-name-display').innerText = data.name;
          loadStudentData(studentId);
        } else {
          alertEl.innerText = data.message;
          alertEl.classList.remove('d-none');
        }
      } catch (err) {
        alertEl.innerText = "Error connecting to server.";
        alertEl.classList.remove('d-none');
      } finally {
        loginBtn.disabled = false;
      }
    });

    async function loadStudentData(studentId) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getStudentData', payload: { studentId } })
      });
      const data = await res.json();

      if (data.status === 'success') {
        const balEl = document.getElementById('balance-display');
        balEl.innerText = (data.balance >= 0 ? '+' : '') + '£' + data.balance.toFixed(2);
        balEl.className = 'display-6 fw-bold ' + (data.balance >= 0 ? 'text-success' : 'text-danger');

        const hwEl = document.getElementById('homework-list');
        hwEl.innerHTML = data.homework.length > 0
          ? data.homework.map(h => `
              <li class="list-group-item p-3">
                <strong>${h.title}</strong> 
                <span class="badge bg-secondary float-end">Due: ${h.dueDate}</span><br>
                <small class="text-muted d-block mt-1">${h.details}</small>
                ${h.pdfUrl ? `<a href="${h.pdfUrl}" target="_blank" class="btn btn-sm btn-outline-primary mt-2 fw-semibold">📄 Download PDF Worksheet</a>` : ''}
              </li>
            `).join('')
          : '<li class="list-group-item p-3 text-muted">No pending homework assigned.</li>';

        const ledgerEl = document.getElementById('ledger-list');
        ledgerEl.innerHTML = data.ledger.length > 0
          ? data.ledger.map(l => `<li class="list-group-item p-3"><span class="fw-bold ${l.type === 'CREDIT' ? 'text-success' : 'text-danger'}">${l.type}</span>: £${parseFloat(l.amount).toFixed(2)} <span class="float-end text-muted small">${l.date}</span></li>`).join('')
          : '<li class="list-group-item p-3 text-muted">No transactions found.</li>';
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
