<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrightMind - Add Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 500px;">
    <a href="admin.html" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Admin Portal</a>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title fw-bold mb-4">Register New Student</h4>
        
        <form id="addStudentForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" id="name" class="form-control" required placeholder="e.g. Alex Smith">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Year Group</label>
            <select id="yearGroup" class="form-select" required>
              <option value="" disabled selected>Select Year Group</option>
              <option value="Year 4">Year 4</option>
              <option value="Year 5">Year 5</option>
              <option value="Year 6">Year 6</option>
              <option value="Year 7">Year 7</option>
              <option value="Year 8">Year 8</option>
              <option value="Year 9">Year 9</option>
              <option value="Year 10">Year 10</option>
              <option value="Year 11">Year 11</option>
              <option value="Year 12">Year 12</option>
              <option value="Year 13">Year 13</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" id="email" class="form-control" required placeholder="student@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Contact Mobile</label>
            <input type="tel" id="phone" class="form-control" required placeholder="e.g. +447123456789">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Fee Per Session (£)</label>
            <input type="number" id="customFee" step="0.01" class="form-control" required placeholder="e.g. 25.00">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Student Portal PIN (4 Digits)</label>
            <input type="password" id="pin" class="form-control" maxlength="4" placeholder="Default: 1234">
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold">Save Student Details</button>
        </form>

        <div id="statusAlert" class="alert mt-3 d-none"></div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLExo5Fpf3oewa3PSzw1jvFcii0vDjkjlkntJiXfPzVRBSog8X9bjwQpDWbNRxNKlw/exec";

    document.getElementById('addStudentForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusAlert = document.getElementById('statusAlert');
      
      submitBtn.disabled = true;
      statusAlert.classList.add('d-none');

      const payload = {
        name: document.getElementById('name').value,
        yearGroup: document.getElementById('yearGroup').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        customFee: parseFloat(document.getElementById('customFee').value),
        pin: document.getElementById('pin').value || '1234'
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addStudent', payload })
        });
        const result = await response.json();

        if (result.status === 'success') {
          statusAlert.className = "alert alert-success mt-3";
          statusAlert.innerHTML = `Registered! Assigned ID: <strong>${result.studentId}</strong> (Default PIN: 1234)`;
          statusAlert.classList.remove('d-none');
          document.getElementById('addStudentForm').reset();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        statusAlert.className = "alert alert-danger mt-3";
        statusAlert.innerText = "Error: " + err.message;
        statusAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
